<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)" />
    <title>Pranjali Prasai — Frontend &amp; Full Stack Developer</title>
    <meta name="description" content="Pranjali Prasai, BSc (Hons) Computing (First Class Honours) and frontend / full stack developer in Kathmandu." />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
